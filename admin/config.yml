# CHANGE repo to your GitHub repository (owner/name)
backend:
  name: github
  repo: 0x4rc4n3/0x4rc4n3
  branch: main
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: site
    label: Profile & Site
    files:
      - name: profile
        label: Profile
        file: content/site.json
        fields:
          - {label: Name, name: name, widget: string}
          - {label: Role, name: role, widget: string}
          - {label: Photo, name: photo, widget: image}
          - {label: SEO description, name: description, widget: text}
          - {label: About paragraphs, name: about, widget: list, field: {label: Paragraph, name: p, widget: text}}
          - {label: Skills heading, name: skillsTitle, widget: string}
          - label: Skills
            name: skills
            widget: list
            fields: [{label: Label, name: label, widget: string}, {label: Value, name: value, widget: text}]
          - {label: Experience heading, name: experienceTitle, widget: string}
          - label: Experience
            name: experience
            widget: list
            fields: [{label: Title, name: title, widget: string}, {label: Organisation, name: org, widget: string}, {label: Description, name: desc, widget: text}]
          - {label: Awards heading, name: extrasTitle, widget: string}
          - label: Awards, certifications, training
            name: extras
            widget: list
            fields: [{label: Label, name: label, widget: string}, {label: Text, name: text, widget: text}]
          - label: Contact
            name: contact
            widget: object
            fields: [{label: Email, name: email, widget: string}, {label: GitHub URL, name: github, widget: string}, {label: LinkedIn URL, name: linkedin, widget: string}, {label: Phone, name: phone, widget: string}, {label: Location, name: location, widget: string}]
          - {label: Contact form endpoint (optional, e.g. Formspree URL), name: formAction, widget: string, required: false}
  - name: works
    label: Works
    folder: content/works
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Tag (e.g. OPEN SOURCE), name: type, widget: string}
      - {label: Order (1 = first), name: order, widget: number, value_type: int, default: 10}
      - {label: Thumbnail / cover image, name: image, widget: image, required: false}
      - {label: Card initials (if no image), name: mark, widget: string, required: false}
      - {label: Tech stack, name: stack, widget: string, required: false}
      - {label: Duration, name: duration, widget: string, required: false}
      - {label: Impact, name: impact, widget: string, required: false}
      - {label: Repository URL, name: link, widget: string, required: false}
      - {label: Project website, name: site, widget: string, required: false}
      - {label: Summary, name: summary, widget: text}
      - {label: Body, name: body, widget: markdown}
  - name: blogs
    label: Blogs
    folder: content/blogs
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: string, hint: 'YYYY-MM-DD'}
      - {label: Order (date tie-breaker), name: order, widget: number, value_type: int, default: 100}
      - {label: Cover image, name: image, widget: image, required: false}
      - {label: Summary, name: summary, widget: text}
      - {label: Body, name: body, widget: markdown}

name: Build Portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # build.mjs also validates content, internal links/assets and the CSP-safe markup,
      # and exits non-zero on any problem, so this step doubles as the test suite.
      - run: npm run build
